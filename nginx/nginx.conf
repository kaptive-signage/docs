worker_processes  1;

events {
  worker_connections  1024;
}

http {
  # Extract preferred locale from the Accept-Language header
  map $http_accept_language $preferred_locale {
    default  "";
    ~*^fr    "fr";
    ~*^de    "de";
  }

  server {
    listen 8080;
    server_name   _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    error_page 404 /404.html;
    location = /404.html {
            root /usr/share/nginx/html;
            internal;
    }

    # Already-localized paths: serve directly, no redirect
    location ~ ^/(fr|de)(/|$) {
      try_files $uri $uri/index.html =404;
    }

    # Paths without a locale prefix: redirect to preferred language if detected
    location / {
      if ($preferred_locale != "") {
        return 302 https://$host/$preferred_locale$request_uri;
      }
      try_files $uri $uri/index.html =404;
    }
  }
}